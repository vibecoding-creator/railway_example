<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway 방명록</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-10">
    <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-indigo-600">📝 Railway 방명록</h1>
        
        <form action="/submit" method="post" class="mb-6">
            <div class="flex gap-2">
                <input type="text" name="content" placeholder="메시지를 남겨주세요..." required
                    class="flex-1 border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-indigo-500">
                <button type="submit" 
                    class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition">
                    등록
                </button>
            </div>
        </form>

        <ul class="space-y-3">
            {% for message in messages %}
            <li class="p-4 bg-gray-50 rounded border border-gray-200">
                {{ message.content }}
            </li>
            {% else %}
            <li class="text-center text-gray-400 py-4">아직 메시지가 없습니다. 첫 번째 메시지를 남겨보세요!</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
